services:
  mcp-landing:
    build:
      context: .
      dockerfile: Dockerfile
    image: mcp-landing-page:latest
    container_name: mcp-landing-app
    restart: unless-stopped
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    environment:
      - PORT=80
